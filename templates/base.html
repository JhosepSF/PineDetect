{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PineDetect - Detección y clasificación inteligente del estado de madurez de piñas mediante Visión por Computador con YOLOv8.">
    <title>{% block title %}PineDetect — Detección y Clasificación de Piñas{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    
    <!-- Hoja de Estilos Personalizada -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <!-- Chart.js para Gráficos Interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% csrf_token %}
    {% block content %}{% endblock %}

    <!-- Script Principal -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
